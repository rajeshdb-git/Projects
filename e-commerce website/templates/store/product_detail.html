{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | Brand_name</title>
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
  <script src="{% static 'js/product-detail.js' %}" defer></script>
</head>
<body class="detail-page">
  <header class="account-header">
    <a class="account-brand" href="{% url 'home' %}">Brand_name</a>
    <a class="account-back" href="{% url 'home' %}">Back to shop</a>
  </header>
  <main class="detail-shell" data-product-id="{{ product_id }}">
    <p class="detail-loading">Loading product...</p>
  </main>
</body>
</html>
