{% extends 'admin/base_admin.html' %}{% block title %}{{ title }}{% endblock %}{% block content %}<section class="page-heading"><div><p class="admin-kicker">Catalog</p><h1>{{ title }}</h1></div></section><form class="form-panel" method="post" enctype="multipart/form-data">{% csrf_token %}{% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}<div class="form-grid">{% for field in form %}<label class="form-field">{{ field.label }}{{ field }}{% if field.errors %}<small>{{ field.errors|striptags }}</small>{% endif %}</label>{% endfor %}</div><button class="primary-button" type="submit">Save Product</button><a class="secondary-button" href="{% url 'admin-products' %}">Cancel</a></form>{% endblock %}
